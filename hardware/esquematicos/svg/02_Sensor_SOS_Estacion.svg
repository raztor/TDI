<text x="15" y="118" font-family="Arial, sans-serif" font-size="2.65" font-weight="400" text-anchor="start" fill="#667782">Contacto seco: INPUT_PULLUP interno. Reposo HIGH; pulsado LOW. V del modulo queda aislado.</text>
<text x="15" y="198" font-family="Arial, sans-serif" font-size="3.3" font-weight="700" text-anchor="start" fill="#183449">SECUENCIA FUNCIONAL Y CONFIGURACION</text>
<text x="15" y="205" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" text-anchor="start" fill="#667782">Boton: rebote 40 ms, pulsacion mantenida 2 s; hasta 3 intentos separados 60 s. No se instalan LED ni buzzer externos.</text>
<text x="15" y="211" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" text-anchor="start" fill="#667782">SOS: WAITING -&gt; TX -&gt; ACK de registro de la estacion -&gt; REGISTERED en el RAK. ACK no equivale a atencion de rescate.</text>
<text x="15" y="217" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" text-anchor="start" fill="#667782">Telemetria: el PC solicita lecturas cada 120 s. La publicacion automatica publica usa su intervalo separado de 1800 s.</text>
<text x="15" y="223" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" text-anchor="start" fill="#667782">RAK !1630f9c9 / Heltec !849c7328. Ambos CLIENT_MUTE; ANZ / LONG_FAST / slot20 / 919,875 MHz; MQTT deshabilitado.</text>
<text x="15" y="229" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" text-anchor="start" fill="#667782">Antenas: un puerto RF por placa, sin conmutador compartido. Latiguillo RAK al radiador 915 MHz; Heltec a su antena de kit.</text>
<text x="15" y="235" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" text-anchor="start" fill="#667782">Las conexiones internas WisBlock son board-to-board; el esquema indica su funcion, no reproduce los circuitos de las placas.</text>
<text x="15" y="258" font-family="Arial, sans-serif" font-size="2.45" font-weight="400" text-anchor="start" fill="#667782">Referencias: docs.rakwireless.com / RAK19007 y RAK1906; firmware/meshtastic; testing/banco-rak-heltec.md. Sin revision ERC de PCB.</text>
</svg>
